# Render Blueprint for the standalone Doctor Tracker API.
services:
  - type: web
    name: doctor-tracker-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ADMIN_NAME
        value: Doctor Tracker Demo Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
